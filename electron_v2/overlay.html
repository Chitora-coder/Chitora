<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Consolas', 'Courier New', monospace;
    }
    
    #shell-container {
      background: rgba(26, 26, 26, 0.9);
      border: 1px solid #00ff00;
      border-radius: 4px;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
    }

    #header {
      background: #333;
      color: #aaa;
      font-size: 10px;
      padding: 2px 8px;
      border-bottom: 1px solid #444;
      display: flex;
      justify-content: space-between;
    }

    #content {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
    }
    
    #answer {
      font-size: 28px;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
    }
  </style>
</head>
<body>
  <div id="shell-container">
    <div id="header">
      <span>AI ENGINE v4 > SHELL</span>
      <span>READY</span>
    </div>
    <div id="content">
      <div id="answer">...</div>
    </div>
  </div>
  
  <script>
    const { ipcRenderer } = require('electron');
    
    ipcRenderer.on('show-answer', (event, answer) => {
      const answerEl = document.getElementById('answer');
      answerEl.textContent = answer;
      
      const container = document.getElementById('shell-container');
      if (answer === 'ERR' || answer.includes('FAILED')) {
        container.style.borderColor = '#ff0000';
      } else {
        container.style.borderColor = '#00ff00';
      }
    });
  </script>
</body>
</html>
